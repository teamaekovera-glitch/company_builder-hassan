# Mirrors the aekovera_pro workspace CI pattern: lint → typecheck → test → build.
# The scaffold has no database yet; the Postgres service job and MOCK env arrive
# with the store/adapter tasks. `pnpm test` is the zero-network offline gate —
# every test runs against the deterministic mock provider (no HTTP, no secrets).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (offline, zero network)
        run: pnpm test

      - name: Build
        run: pnpm build
